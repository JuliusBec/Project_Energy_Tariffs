services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dynergy-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./app_data:/app/app_data
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    command: uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - dynergy-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: dynergy-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src/frontend:/app
      - /app/node_modules  # Anonymous volume to preserve node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dynergy-network

networks:
  dynergy-network:
    driver: bridge
